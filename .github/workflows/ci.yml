# Camada 5 — verificação independente. Corre num ambiente que o agente não controla.
# Mesmo que o agente contorne hooks locais (--no-verify), aqui não passa.
#
# Proteções recomendadas no GitHub (Settings → Branches → main):
#   - Require pull request + 1 review humano
#   - Require status checks: check, contract, diff-budget
#   - Bloquear force-push
# E em Settings → Code review: CODEOWNERS para tests/acceptance/ e .github/.

name: CI
on:
  pull_request:
    # labeled/unlabeled: as labels de aprovação humana (diff-budget-override,
    # contract-change-approved) só contam num evento novo. Ver WI-0013.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  check:
    name: Lint · Types · Testes · Specs
    runs-on: ubuntu-latest
    # Os testes da API correm contra um Postgres real (WI-0016, ADR-0005).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: node scripts/validate-specs.mjs
      # Os mesmos scripts npm que o make e o lefthook correm (WI-0015).
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  contract:
    name: Proteção do contrato (tests/acceptance)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Falhar se o contrato mudou sem label de aprovação humana
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- tests/acceptance/ evals/datasets/ evals/thresholds.json || true)
          HAS_LABEL='${{ contains(github.event.pull_request.labels.*.name, 'contract-change-approved') }}'
          if [ -n "$CHANGED" ] && [ "$HAS_LABEL" != "true" ]; then
            echo "::error::O contrato (tests/acceptance/ · evals/datasets/ · evals/thresholds.json) foi alterado:"
            echo "$CHANGED"
            echo "::error::Exige a label 'contract-change-approved' (decisão humana) + ADR."
            exit 1
          fi
          echo "✓ Contrato intacto ou alteração aprovada por humano."

  diff-budget:
    name: Orçamento de diff (anti scope-creep)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar orçamento
        env:
          DIFF_BUDGET_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'diff-budget-override') && '1' || '0' }}
        run: node scripts/check-diff-budget.mjs origin/${{ github.base_ref }}
