# Postgres local para o gate (WI-0016). Sem volume: os dados de teste são descartáveis.
# Porta 54329 para não chocar com um Postgres que já corra em 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 15
